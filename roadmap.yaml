project: letf-finder
description: Find the leveraged / inverse ETFs related to any equity, self-updating.
updated: 2026-07-13

phases:
  - id: 1
    name: Data foundation and lookup
    status: done
    goal: >
      A self-updating map of leveraged/inverse ETFs from Polygon, queryable by
      ticker, with no hand-maintained list — recognizer rules, not a data file.
    deferred:
      - Sector/thematic relatedness, e.g. NVDA -> SOXL — needs holdings (-> Phase 2)
      - Metrics enrichment (ATR%, RS, extension) (-> Phase 2)
      - Expense ratios per fund — needs another data source (-> Phase 2)
      - Web front-end (-> Phase 3)
      - Intraday / real-time data
    success_criteria:
      - text: recognizer parses factor/direction/underlying with confidence flags (offline-tested)
        done: true
      - text: every lookup result carries the daily-reset / decay + factor caveat
        done: true
      - text: discover.py builds letf_universe.json live from Polygon
        done: true
      - text: lookup(ticker) returns correct direct + index LETFs on real data
        done: true
    changelog:
      - date: 2026-07-06
        note: >
          Built the recognizer (pure, offline tests green), discover.py
          (Polygon reference-tickers pull), and lookup.py.
      - date: 2026-07-06
        note: >
          Live run: 743 leveraged/inverse ETFs discovered. Fixed 2 recognizer
          bugs found in real data (BulletShares 'bull' false-positive;
          T-REX issuer token shadowing underlyings). Low-confidence 40 -> 4.
          NVDA and QQQ lookups verified correct. Phase 1 done.

  - id: 2
    name: Tradability and freshness
    status: in_progress
    goal: >
      Results a swing trader can act on (liquidity-ranked, complete universe)
      from data that stays current without maintenance.
    success_criteria:
      - text: weekly automated refresh keeps the live demo current (Action + Pages)
        done: true
      - text: ETNs included in the universe (FNGU-class products discoverable)
        done: true
      - text: every result shows avg daily $ volume; groups sorted by it
        done: false
      - text: recognizer refactored to a single parse pass (no duplicate marker logic)
        done: true
    changelog:
      - date: 2026-07-13
        note: >
          Re-scoped from "Smart layer" after the swing-trader product review:
          actionability (liquidity) and freshness beat sector mapping in value;
          sector work moves to Phase 3. ETN gap found (0 MicroSectors products
          in a type=ETF-only pull).
      - date: 2026-07-13
        note: >
          Weekly refresh shipped and verified end-to-end: Bearer-header auth,
          encrypted repo secret, cron + manual dispatch, bot commit, Pages
          redeploy. Live demo regenerated 2026-07-13 by the Action itself.
      - date: 2026-07-13
        note: >
          Recognizer refactored to one parse pass (NameParse dataclass);
          T-REX brand-stripping replaces the REX stopword hack; excluded
          'leveraged loan' asset class and bare bull/bear from unknown
          issuers. Low-confidence 4 -> 1 (the 1 is genuinely ambiguous);
          23 tests green. Plus hygiene: CI + badge, search guards, result
          cap, factor-less records excluded from UI payload explicitly.
      - date: 2026-07-13
        note: >
          ETN coverage live: +37 products (774 total) incl. 19 MicroSectors
          notes (BULZ/BERZ, BNKU/BNKD, 3x AI). Recognizer needed zero rule
          changes to parse ETN naming.

  - id: 3
    name: Smart layer
    status: planned
    goal: Sector relatedness and per-fund fundamentals.
    success_criteria:
      - text: NVDA surfaces SOXL/SOXS via a semiconductor-sector link
        done: false
      - text: each result shows expense ratio
        done: false
    changelog:
      - date: 2026-07-06
        note: Deferred from Phase 1 — needs holdings + a fundamentals source.
      - date: 2026-07-13
        note: Renumbered from Phase 2 in the tradability re-scope.

  - id: 4
    name: Usable
    status: done
    goal: A front-end anyone can use, with the risk caveats visible.
    success_criteria:
      - text: non-technical user can look up a ticker and understand the risks
        done: true
    changelog:
      - date: 2026-07-06
        note: Deferred until data + smart layers prove out.
      - date: 2026-07-13
        note: >
          Shipped ahead of order: dark search UI live at
          youngrichard.github.io/letf-finder with decay note in the footer.
